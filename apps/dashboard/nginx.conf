# ---------------------------------------------------------------------------
# Apercus de liens (Open Graph)
#
# Le dashboard est une SPA : un robot social ne recoit que le squelette
# `index.html` et n'y trouve donc qu'un titre generique, quel que soit le lien
# partage. On aiguille ces robots - et eux seuls - vers `/api/og/preview` de
# l'API, qui rend une page portant les vraies balises Open Graph de la page
# demandee. Les visiteurs humains continuent de recevoir la SPA a l'identique.
#
# `__OG_API_ORIGIN__` est remplace au build par VITE_API_URL (cf. DockerfileDash),
# la meme valeur que celle avec laquelle la SPA a ete compilee. Le fichier reste
# ainsi strictement identique sur `main` et sur `recette`, comme la CSP plus bas.
# Non substitue (build sans VITE_API_URL), l'aiguillage se desactive de lui-meme.
# ---------------------------------------------------------------------------
map $host $og_api_origin {
    default "__OG_API_ORIGIN__";
}

# Teste la FORME de la valeur plutot que le placeholder lui-meme : la
# substitution du build ne doit pas pouvoir reecrire sa propre condition d'arret.
map $og_api_origin $og_api_configured {
    default       0;
    "~^https?://" 1;
}

# Robots d'apercu uniquement. Les moteurs de recherche en sont volontairement
# absents : ils doivent indexer la vraie page, pas notre page de redirection.
map $http_user_agent $og_is_crawler {
    default 0;
    "~*(discordbot|twitterbot|facebookexternalhit|facebookcatalog|slackbot|slack-imgproxy|telegrambot|whatsapp|linkedinbot|embedly|redditbot|mastodon|pleroma|misskey|iframely|skypeuripreview|vkshare|flipboard|bitlybot|nuzzel|snapchat|bluesky|opengraph)" 1;
}

# nginx ne sait pas combiner deux conditions dans un `if` : on compose les deux
# drapeaux en une seule variable de decision.
map "$og_is_crawler:$og_api_configured" $og_route {
    default 0;
    "1:1"   1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression.
    #
    # `gzip_static` sert les fichiers .gz pre-generes au build (cf. DockerfileDash),
    # ce qui donne une compression niveau 9 sans cout CPU a la requete. `gzip` reste
    # actif en repli pour tout ce qui n'a pas de .gz (reponses generees, fichiers
    # ajoutes hors build).
    #
    # L'image nginx:alpine n'embarque pas le module brotli : gzip uniquement.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf;

    # Security headers
    #
    # La CSP autorise volontairement les DEUX API (prod + beta) pour que ce
    # fichier soit strictement identique sur `main` et sur `recette` : sans ca,
    # chaque merge recette -> main ecrase la CSP de prod par celle de la beta et
    # casse dash.kotbo.fr (connect-src bloque alors tous les appels a l'API).
    #
    # C'est VITE_API_URL (build arg, cf. DockerfileDash) qui determine l'API
    # reellement appelee par chaque environnement. La CSP ne fait qu'autoriser :
    # elle ne route rien, donc elargir la liste ne fait pas taper la beta sur la
    # prod. Contrepartie assumee : une erreur de VITE_API_URL ne sera plus
    # attrapee par une violation CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.kotbo.fr wss://api.kotbo.fr https://beta-api.kotbo.fr wss://beta-api.kotbo.fr https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; frame-src https://api.kotbo.fr https://beta-api.kotbo.fr; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # 'same-site' (et non 'same-origin') : le dashboard et l'API sont deux
    # sous-domaines distincts de kotbo.fr, dans les deux environnements.
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # SPA routing: fallback to index.html for non-file routes.
    #
    # Le `return 418` est le detour classique pour brancher un `if` sur une
    # location nommee : `proxy_pass` place directement dans un `if` a des effets
    # de bord documentes, pas `error_page`.
    location / {
        error_page 418 = @og_preview;
        if ($og_route) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    # Apercu Open Graph rendu par l'API pour le chemin demande.
    location @og_preview {
        # `proxy_pass` avec une variable exige un resolveur : 127.0.0.11 est le
        # DNS interne de Docker, qui relaie les noms publics.
        resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
        resolver_timeout 3s;

        # `$request_uri` et non `$uri` : il est transmis tel qu'il est arrive,
        # donc toujours correctement encode. `$uri` est decode, et un chemin
        # contenant une espace produirait une ligne de requete invalide.
        proxy_pass $og_api_origin/api/og/preview?path=$request_uri;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # L'API canonise l'embed vers l'hote reellement partage, pas vers le sien.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # API injoignable ou en erreur : le robot recoit la SPA, comme avant.
        # Un apercu manquant ne doit jamais casser un lien.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @og_fallback;
    }

    location @og_fallback {
        try_files /index.html =404;
    }

    # Le shell SPA référence des chunks hashés et doit être revalidé à chaque
    # déploiement ; les assets eux-mêmes restent immuables un an.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Do not fallback API paths to index.html; return an explicit deployment error instead.
    location ^~ /api/ {
        default_type application/json;
        return 502 '{"error":"Backend API non disponible depuis le conteneur dashboard. Configurez VITE_API_URL ou un reverse proxy /api vers le service bot."}';
    }

    # Prevent caching of the service worker
    location = /sw.js {
        log_not_found off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Static assets can be cached aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
